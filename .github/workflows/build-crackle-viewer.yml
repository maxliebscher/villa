name: 'Build crackle-viewer'

permissions:
  contents: read
  
on:
  push:
    branches:
      - main
    paths:
      - 'crackle-viewer/**'
  pull_request:
    branches:
      - main
    paths:
      - 'crackle-viewer/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-20.04, macos-12, windows-2019]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install Ubuntu dependencies
      if: matrix.os == 'ubuntu-20.04'
      run: sudo apt-get install -y python3-dev python3-pip build-essential gfortran libopenblas-dev liblapack-dev
    - name: Install PyInstaller and Dependencies
      working-directory: ${{ github.workspace }}/crackle-viewer
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    - name: Build with PyInstaller
      working-directory: ${{ github.workspace }}/crackle-viewer
      run: |
        pyinstaller crackle_viewer.spec

    - name: Zip Executable and Dependencies
      shell: pwsh
      working-directory: ${{ github.workspace }}/crackle-viewer
      run: |
        $osType = "${{ runner.os }}"
        if ($osType -eq "Windows") {
          # PowerShell command for Windows
          Compress-Archive -Path dist/* -DestinationPath "$osType-Executable.zip"
        } else {
          # Use PowerShell's native capabilities to handle Linux/macOS zipping if necessary
          & bash -c "cd dist && zip -r ../$osType-Executable.zip ./* && cd .."
        }

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ runner.os }}-Executable
        path: ${{ github.workspace }}/crackle-viewer/${{ runner.os }}-Executable.zip

  release:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        path: release-assets
        merge-multiple: true

    - name: Create or get release
      id: create_release
      uses: actions/github-script@v7
      with:
        script: |
          const latestCommitSha = process.env.GITHUB_SHA.substring(0, 7);
          const fullCommitSha = process.env.GITHUB_SHA;
          const releaseName = `release-${latestCommitSha}`;
          const tagName = `v1.0.0-${latestCommitSha}`;

          let release;
          try {
            release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: tagName
            });
            console.log(`Release already exists: ${release.data.id}`);
          } catch (error) {
            if (error.status === 404) {
              console.log('Creating new release');
              release = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tagName,
                name: releaseName,
                draft: false,
                prerelease: false,
                target_commitish: fullCommitSha
              });
            } else {
              throw error;
            }
          }

          core.setOutput('tag_name', tagName);

    - name: Upload release assets
      env:
        GH_TOKEN: ${{ github.token }}
        TAG_NAME: ${{ steps.create_release.outputs.tag_name }}
      run: gh release upload "$TAG_NAME" release-assets/*.zip --clobber
